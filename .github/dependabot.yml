version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # DataProtection exige Xml, que exige Pkcs; atualizar separados pode causar NU1109.
      dataprotection-crypto:
        applies-to: version-updates
        patterns:
          - Microsoft.AspNetCore.DataProtection.EntityFrameworkCore
          - System.Security.Cryptography.Xml
          - System.Security.Cryptography.Pkcs
      # Resilience exige uma versão mínima de Http; atualizar separados pode causar NU1109.
      http-resilience:
        applies-to: version-updates
        patterns:
          - Microsoft.Extensions.Http
          - Microsoft.Extensions.Http.Resilience

  - package-ecosystem: npm
    directory: /src/ToggleForge.Console
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
