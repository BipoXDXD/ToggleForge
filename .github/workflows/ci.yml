name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Format, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # O build do console gera o CSS com o Tailwind do npm (ADR 0003).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ToggleForge.Console/package-lock.json

      - name: Restore
        run: dotnet restore ToggleForge.slnx

      - name: Verificar formatação
        run: dotnet format ToggleForge.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ToggleForge.slnx --configuration Release --no-restore

      # A jornada do console dirige um Chromium pelo Playwright; o runner Linux precisa das bibliotecas dele.
      - name: Instalar o Chromium do Playwright
        run: pwsh tests/ToggleForge.Api.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # global.json seleciona o Microsoft.Testing.Platform; nesse modo a solução vai em --solution.
      - name: Testes
        run: dotnet test --solution ToggleForge.slnx --configuration Release --no-build

      - name: Verificar vetores do rollout
        run: python3 tools/rollout-vectors/generate.py --check

      - name: Smoke test da demo
        run: dotnet run --project samples/ToggleForge.RolloutDemo --configuration Release --no-build

  api-contract:
    name: Lint do contrato da API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/api-lint/package-lock.json

      - name: Instalar Spectral
        run: npm ci --prefix tools/api-lint

      - name: Spectral com o ruleset OWASP
        run: npm run lint --prefix tools/api-lint

  secrets:
    name: Scan de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
